import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// The app version follows the mobile workspace package.json (mobile/package.json), falling back
// to the repo-root package.json (one version for desktop and mobile).
def meshPackageFile = [rootProject.file('../package.json'), rootProject.file('../../package.json')].find { it.isFile() }
def meshPackageJson = new JsonSlurper().parse(meshPackageFile)
def meshVersionName = meshPackageJson.version.toString()
def meshVersionParts = meshVersionName.replaceAll(/[^0-9.].*$/, '').tokenize('.').collect { it as int }
while (meshVersionParts.size() < 3) meshVersionParts << 0
// 6.12.3 -> 6012003 (room for 999 minor/patch releases per major).
def meshVersionCode = meshVersionParts[0] * 1000000 + meshVersionParts[1] * 1000 + meshVersionParts[2]

android {
    namespace = "org.coloradomesh.meshclient"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.coloradomesh.meshclient"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode meshVersionCode
        versionName meshVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // The Reticulum sidecar ships as jniLibs/<abi>/libmesh_client_reticulum.so and is
            // exec'd by MeshProcess, so native libraries must be extracted to nativeLibraryDir
            // (android:extractNativeLibs="true") instead of being mapped from the APK.
            useLegacyPackaging = true
        }
    }
    testOptions {
        unitTests {
            // Plugin helpers are tested on the JVM; android.* stubs return defaults instead of throwing.
            returnDefaultValues = true
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    // MeshNet: streaming HTTP(S) and WebSocket client.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // MeshDevice: fold / hinge posture (FoldingFeature).
    implementation "androidx.window:window:$androidxWindowVersion"
    implementation "androidx.window:window-java:$androidxWindowVersion"
    // MeshUsbSerial: CDC-ACM, CP210x, CH34x, FTDI, PL2303 drivers over Android USB host.
    implementation "com.github.mik3y:usb-serial-for-android:$usbSerialForAndroidVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver3:$okhttpVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
