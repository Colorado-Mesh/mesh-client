appId: com.mesh-client.app
productName: Mesh-client
protocols:
  - name: Mesh Client LXMF
    schemes:
      - lxm
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
asarUnpack:
  - 'node_modules/systeminformation/**/*'
  - 'node_modules/@stoprocent/**/*'
publish:
  provider: github
  owner: Colorado-Mesh
  repo: mesh-client
  # Keep GitHub Releases as drafts until a maintainer publishes manually.
  releaseType: draft
beforePack: scripts/electron-builder-before-pack.mjs
extraResources:
  - from: resources/icons/win/colorado-mesh.ico
    to: colorado-mesh.ico
  - from: resources/reticulum-sidecar
    to: reticulum-sidecar
    filter:
      - '**/*'
  - from: resources/icons/linux/256x256.png
    to: 256x256.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template.png
    to: macos-menubar-icon-Template.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template@2x.png
    to: macos-menubar-icon-Template@2x.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template@3x.png
    to: macos-menubar-icon-Template@3x.png
mac:
  category: public.app-category.utilities
  # Hardened runtime improves tamper resistance; required for notarized distribution.
  hardenedRuntime: true
  preAutoEntitlements: true
  helperBundleId: com.mesh-client.app.helper
  extendInfo:
    NSBluetoothAlwaysUsageDescription: 'Mesh-client needs Bluetooth to communicate with Meshtastic devices.'
    NSMicrophoneUsageDescription: 'Mesh-client needs the microphone for Reticulum LXST voice calls.'
    NSCameraUsageDescription: 'Mesh-client needs the camera to scan QR codes for channel and contact sharing.'
  target:
    - dmg
    - zip
  icon: resources/icons/mac/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarize after signing via Apple notarytool. Requires APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID env vars at build time.
  # Automatically skipped when code signing is skipped (no cert available).
  notarize: true
# Drag-to-install layout: app icon + Applications folder symlink (Finder DMG window).
dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
      name: Applications
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Utility
  icon: resources/icons/linux/
  desktop:
    entry:
      StartupWMClass: 'com.mesh-client.app'
      Categories: 'Utility;Network;'
  extraResources:
    - from: ./copyright
      to: usr/share/doc/mesh-client/copyright
deb:
rpm:
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icons/win/colorado-mesh.ico
nsis:
  buildUniversalInstaller: false
  # WoA: Nsis7z cannot reliably extract ARM64 LZMA app-arm64.7z (main exe missing).
  useZip: true
  differentialPackage: false
  include: resources/installer.nsh
