[package]
name = "mesh-client-reticulum-sidecar"
version = "0.1.0"
edition = "2024"
description = "Headless Reticulum/LXMF daemon for mesh-client"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[[bin]]
name = "mesh-client-reticulum"
path = "src/main.rs"

[features]
default = []
# Full stack: requires sibling checkouts at ../../rsReticulum, ../../rsLXMF,
# ../../rsNomad, and ../../rsLXST (Ratspeak layout).
rns-stack = [
    "dep:rns-runtime",
    "dep:lxmf-core",
    "dep:nomad-core",
    "dep:lxst-telephony",
    "dep:lxst-core",
    "dep:rns-identity",
    "dep:rns-wire",
    "dep:rns-ratkey",
    "dep:rns-transport",
    "dep:rns-link",
    "dep:rns-crypto",
    "dep:rmpv",
    "dep:tempfile",
    "dep:notify",
]
rns-serial = ["rns-runtime/serial"]
rns-ble = ["rns-runtime/ble", "dep:rns-interface", "rns-interface/ble"]
rns-rnode-tcp = ["rns-runtime/rnode-tcp"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["full", "test-util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
tempfile = { version = "3", optional = true }
rmpv = { version = "1", optional = true }

base64 = "0.22"
bytes = "1"
ciborium = "0.2"
rand = "0.8"
thiserror = "2"
notify = { version = "6.1", optional = true, default-features = true }

[dependencies.rns-runtime]
package = "rns-runtime"
path = "../../rsReticulum/crates/rns-runtime"
optional = true
features = ["serial"]

[dependencies.rns-identity]
package = "rns-identity"
path = "../../rsReticulum/crates/rns-identity"
optional = true

[dependencies.rns-wire]
package = "rns-wire"
path = "../../rsReticulum/crates/rns-wire"
optional = true
features = ["std"]

[dependencies.rns-ratkey]
package = "rns-ratkey"
path = "../../rsReticulum/crates/rns-ratkey"
optional = true

[dependencies.rns-transport]
package = "rns-transport"
path = "../../rsReticulum/crates/rns-transport"
optional = true

[dependencies.lxmf-core]
package = "lxmf-core"
path = "../../rsLXMF/crates/lxmf-core"
optional = true

[dependencies.nomad-core]
package = "nomad-core"
path = "../../rsNomad/crates/nomad-core"
optional = true

[dependencies.lxst-telephony]
package = "lxst-telephony"
path = "../../rsLXST/crates/lxst-telephony"
optional = true

[dependencies.lxst-core]
package = "lxst-core"
path = "../../rsLXST/crates/lxst-core"
optional = true

[dependencies.rns-interface]
package = "rns-interface"
path = "../../rsReticulum/crates/rns-interface"
optional = true
features = ["ble"]

[dependencies.rns-link]
package = "rns-link"
path = "../../rsReticulum/crates/rns-link"
optional = true

[dependencies.rns-crypto]
package = "rns-crypto"
path = "../../rsReticulum/crates/rns-crypto"
optional = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Groups at lower priority so individual allows below can override.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# High-churn pedantic style (ratchet down over time). Protocol casts and large
# modules are intentional; INI fixtures keep raw-string hashes for clarity.
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
assigning_clones = "allow"
map_unwrap_or = "allow"
case_sensitive_file_extension_comparisons = "allow"
