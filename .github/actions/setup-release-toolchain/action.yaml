name: Setup release toolchain
description: >-
  Install the non-Node tools scripts/release.sh pre-flight requires (actionlint,
  yamllint, flatpak-node-generator, Linux build deps, Rust). Shared by Cut release
  and the e2e.yaml Release preflight job so the preflight runs in the same environment
  as a real cut.
  Run after checkout and Node/pnpm dependency install.

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      run: pnpm run setup:actionlint

    - name: Add actionlint to PATH
      shell: bash
      env:
        HOOKS_BIN: ${{ github.workspace }}/.githooks/bin
      run: echo "${HOOKS_BIN}" >> "$GITHUB_PATH"

    - name: Install flatpak-node-generator
      shell: bash
      run: |
        python3 -m pip install --require-hashes --only-binary=:all: \
          -r scripts/requirements-flatpak-generator.txt
        # Keep pin in sync with scripts/flatpakPnpmStoreVersion.mjs FLATPAK_NODE_GENERATOR_COMMIT.
        # --no-deps: runtime deps come only from the hash-locked requirements file.
        COMMIT=$(node --input-type=module -e "
          import { FLATPAK_NODE_GENERATOR_COMMIT } from './scripts/flatpakPnpmStoreVersion.mjs';
          process.stdout.write(FLATPAK_NODE_GENERATOR_COMMIT);
        ")
        pip3 install --force-reinstall --no-cache-dir --no-deps \
          "git+https://github.com/flatpak/flatpak-builder-tools@${COMMIT}#subdirectory=node"

    # Install this last: flatpak-node-generator also depends on PyYAML, and its
    # forced install must never replace the hash-authenticated yamllint runtime.
    - name: Install yamllint
      shell: bash
      run: >-
        python3 -m pip install --require-hashes --only-binary=:all:
        -r scripts/requirements-yamllint.txt

    - name: Install Linux build deps (sidecar / Flatpak checks)
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
