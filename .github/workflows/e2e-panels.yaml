name: E2E panels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

permissions:
  contents: read

# PR check for the per-protocol panel matrix (e2e/panelMatrix.spec.ts). The full 3-OS suite
# stays in e2e.yaml (daily + manual). Path-filtered, so it is not a required check.
# scripts/e2e-panels-workflow.test.mjs checks that every path below matches a file.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'src/renderer/App.tsx'
      - 'src/renderer/lazyTabPanels.ts'
      - 'src/renderer/lazyAppPanels.ts'
      - 'src/renderer/components/**'
      - 'src/renderer/lib/appTabMappings.ts'
      - 'src/renderer/hooks/useChatMacroShortcuts.ts'
      - 'src/renderer/lib/meshcore/**'
      - 'src/renderer/lib/roomMacros.ts'
      - 'src/renderer/lib/navSections.ts'
      - 'src/renderer/lib/panelLauncher.ts'
      - 'src/renderer/lib/tabSlotIds.ts'
      - 'e2e/panelMatrix.spec.ts'
      - 'e2e/panelAnchors.ts'
      - 'e2e/electronApp.ts'
      - 'e2e/fixtures/meshcore-radio.ts'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-panels.yaml'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  panels:
    name: Panel matrix E2E (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # Same runtime libraries as the ubuntu-24.04 leg of e2e.yaml (t64 package names).
      - name: Install Linux Electron runtime libs + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64 \
            libgbm1 \
            libasound2t64 \
            libxshmfence1 \
            libx11-xcb1 \
            libxcb1 \
            libxext6 \
            libxfixes3 \
            libxrender1 \
            libxi6 \
            libdrm2 \
            libdbus-1-3

      - name: Build unpackaged app
        run: pnpm run build

      - name: Run panel matrix E2E
        run: xvfb-run -a pnpm exec playwright test e2e/panelMatrix.spec.ts

      - name: Upload Playwright artifacts on failure
        if: failure() && github.actor != 'nektos/act'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-panel-matrix-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
