name: Bluetooth helper

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ble-sidecar/**'
      - '.github/workflows/ble-sidecar.yaml'
      - 'scripts/build-ble-sidecar-release.mjs'
  pull_request:
    paths:
      - 'ble-sidecar/**'
      - '.github/workflows/ble-sidecar.yaml'
      - 'scripts/build-ble-sidecar-release.mjs'

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - name: Install Linux BLE build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo fmt --check
        working-directory: ble-sidecar
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: ble-sidecar
        run: cargo clippy --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mesh-hub-ble-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mesh-hub-ble-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mesh-hub-ble-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mesh-hub-ble-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux BLE build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Swatinem/rust-cache v2.9.2; keep target triples separate within this matrix.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ble-sidecar -> target
          key: ${{ matrix.target }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Test sidecar
        working-directory: ble-sidecar
        run: cargo test
      - name: Build sidecar
        working-directory: ble-sidecar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ble-sidecar/target/${{ matrix.target }}/release/mesh-hub-ble*
          retention-days: 14

  build-windows-arm64:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-pc-windows-msvc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ble-sidecar -> target
          key: aarch64-pc-windows-msvc
          cache-bin: false
          cache-workspace-crates: false
      # Host tests run in the Windows x64 matrix job.
      - name: Build WoA Bluetooth helper
        working-directory: ble-sidecar
        run: cargo build --release --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-hub-ble-win-arm64
          path: ble-sidecar/target/aarch64-pc-windows-msvc/release/mesh-hub-ble.exe
          retention-days: 14
