name: CI Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Markdown lint
        run: pnpm run lint:md

      - name: Lint
        run: pnpm run lint

      - name: License check
        run: pnpm run check:licenses

      - name: Install actionlint
        run: pnpm run setup:actionlint

      - name: Actionlint
        run: |
          export PATH="${GITHUB_WORKSPACE}/.githooks/bin:${PATH}"
          actionlint

      - name: pnpm audit (high+, non-blocking)
        run: |
          pnpm audit --audit-level=high || echo "::warning::pnpm audit found high-severity vulnerabilities"

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML Lint
        run: yamllint -f github -s .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check Flatpak
        run: pnpm run check:flatpak

      # PR-cycle only (not pre-commit): needs flatpak-node-generator to verify offline store vN.
      - name: Install flatpak-node-generator
        run: |
          FBTOOLS=git+https://github.com/flatpak/flatpak-builder-tools
          # Keep in sync with scripts/flatpakPnpmStoreVersion.mjs FLATPAK_NODE_GENERATOR_COMMIT.
          # --force-reinstall: same 0.1.0 version across commits; plain pip is a no-op on
          # preinstalled images and leaves the storeDir= generator.
          pip3 install --force-reinstall --no-cache-dir \
            "${FBTOOLS}@ac5a296ac6111aa2319daf532f609a067b88d8a9#subdirectory=node"

      - name: Check Flatpak offline pnpm sources
        run: pnpm run check:flatpak-offline-pnpm

      - name: Install Flatpak validation tools
        run: sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop file
        run: desktop-file-validate flatpak/org.coloradomesh.MeshClient.desktop

      - name: Validate metainfo
        run: appstreamcli validate --no-net flatpak/org.coloradomesh.MeshClient.metainfo.xml
