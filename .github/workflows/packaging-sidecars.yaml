name: Packaging sidecars

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, mac, linux, win]
        default: all
  workflow_call:
    inputs:
      platforms:
        description: Platforms to build (all, mac, linux, win, or comma-separated)
        type: string
        default: all

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Resolve sidecar matrix
        id: matrix
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          include="$(node scripts/resolve-release-matrix.mjs --sidecars)"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Stage Reticulum ${{ matrix.platform }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Install Linux sidecar build dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-setup-linux-arm64-apt.sh
          sudo apt-get install -y libdbus-1-dev libdbus-1-dev:arm64 pkg-config gcc-aarch64-linux-gnu
      # Zig + cargo-zigbuild: glibc ABI floor on ubuntu-latest (docs/ci-cd.md#linux-sidecar-glibc).
      - name: Setup Zig
        if: matrix.platform == 'linux'
        # mlugg/setup-zig v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        run: cargo install cargo-zigbuild --version 0.24.1 --locked
      # Swatinem/rust-cache v2.9.2; isolate packaging from the validation workflow.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: reticulum-sidecar -> target
          key: packaging-${{ matrix.target }}
          cache-bin: false
          cache-workspace-crates: false
      # Each OS runs host tests once, in its native architecture job.
      - name: Build and stage sidecar
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/.rsstack
        run: >-
          node scripts/build-reticulum-sidecar-release.mjs
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          ${{ !matrix.run_tests && '--skip-tests' || '' }}
      # Fail closed if zigbuild/plain cargo raised the glibc ABI above 2.35.
      - name: Assert Linux sidecar glibc floor
        if: matrix.platform == 'linux'
        env:
          SIDECAR_DIR: resources/reticulum-sidecar/staged/${{ matrix.platform }}-${{ matrix.arch }}
        run: node scripts/check-reticulum-sidecar-glibc.mjs "$SIDECAR_DIR/mesh-client-reticulum"
      # Native-arch only: exec the staged binary, auth stdin, poll /api/v1/status.
      - name: Smoke-test staged sidecar HTTP
        if: matrix.run_tests
        env:
          SIDECAR_DIR: resources/reticulum-sidecar/staged/${{ matrix.platform }}-${{ matrix.arch }}
          SIDECAR_BIN: ${{ matrix.platform == 'win32' && 'mesh-client-reticulum.exe' || 'mesh-client-reticulum' }}
        run: node scripts/smoke-reticulum-sidecar-http.mjs "$SIDECAR_DIR/$SIDECAR_BIN"
      - name: Archive sidecar and source revisions
        shell: bash
        env:
          SIDECAR: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          cp .rsstack/RESOLVED_SHAS.txt "resources/reticulum-sidecar/staged/$SIDECAR/RESOLVED_SHAS.txt"
          tar -cf "sidecar-$SIDECAR.tar" -C resources/reticulum-sidecar/staged "$SIDECAR"
      - name: Upload staged sidecar
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-reticulum-staged-${{ matrix.platform }}-${{ matrix.arch }}
          path: sidecar-${{ matrix.platform }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
