name: Third-party licenses

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - scripts/generate-third-party-licenses.mjs
      - .github/workflows/third-party-licenses.yaml

# Coalesce overlapping regenerations (path-filtered pushes can stack) so we do not
# leave multiple stale license PRs from canceled/superseded runs.
concurrency:
  group: third-party-licenses
  cancel-in-progress: true

jobs:
  update:
    name: Update third-party licenses
    runs-on: ubuntu-latest
    environment: license-automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      # persist-credentials: false avoids Duplicate Authorization when CPR
      # configures its own http.*.extraheader (the checkout action's default helper).
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false

      # Rust sidecar tables need cargo metadata --all-features (Ratspeak path deps).
      # Without this, docs:licenses writes the "run locally" stub and PRs regress main.
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad, rsLXST, lrgp-rs)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/.rsstack
        run: bash scripts/clone-ratspeak-stack.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify pnpm
        run: node scripts/ci-verify-pnpm.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Open Source Licenses
        run: pnpm run check:licenses

      - name: Generate third-party licenses
        run: pnpm run docs:licenses

      - name: Refuse Rust-section stub
        run: |
          if grep -Fq 'run it locally to view this table' docs/third-party-licenses.md; then
            echo '::error::docs:licenses omitted Rust sidecar tables'
            echo '::error::(cargo/.rsstack missing). Refusing regressing PR.'
            exit 1
          fi

      - name: Detect license doc changes
        id: licenses_diff
        run: |
          if git diff --quiet -- docs/third-party-licenses.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Open a PR instead of pushing to main — the merge-queue ruleset blocks
      # direct pushes, and GitHub Actions cannot be added as a bypass actor
      # on this org (“must be part of the ruleset source or owner organization”).
      # An optional license-only token allows pull_request checks to start.
      # GITHUB_TOKEN can still open the documentation PR without release credentials.
      # Unique branch per run avoids thrashing one tip under concurrent main pushes.
      - name: Create pull request
        if: steps.licenses_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.LICENSE_PR_TOKEN || github.token }}
          commit-message: 'docs: update third-party licenses'
          title: 'docs: update third-party licenses'
          body: |
            Regenerated `docs/third-party-licenses.md` after dependency changes.

            Opened automatically by `third-party-licenses.yaml` (direct pushes to
            `main` are blocked by the merge-queue ruleset).

            When opened with GITHUB_TOKEN, a maintainer must start the required
            checks before merging; GitHub suppresses workflows from token-created PRs.
          base: main
          branch: chore/third-party-licenses-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            docs/third-party-licenses.md
