name: Third-party licenses

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - scripts/generate-third-party-licenses.mjs
      - .github/workflows/third-party-licenses.yaml

# Coalesce overlapping regenerations (path-filtered pushes can stack) so we do not
# leave multiple stale license PRs from canceled/superseded runs.
concurrency:
  group: third-party-licenses
  cancel-in-progress: true

jobs:
  update:
    name: Update third-party licenses
    runs-on: ubuntu-latest
    environment: license-automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      # persist-credentials: false avoids Duplicate Authorization when CPR
      # configures its own http.*.extraheader (the checkout action's default helper).
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false

      # Rust sidecar tables need cargo metadata --all-features (Ratspeak path deps).
      # Without this, docs:licenses writes the "run locally" stub and PRs regress main.
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad, rsLXST, lrgp-rs)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/.rsstack
        run: bash scripts/clone-ratspeak-stack.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify pnpm
        run: node scripts/ci-verify-pnpm.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Open Source Licenses
        run: pnpm run check:licenses

      - name: Generate third-party licenses
        run: pnpm run docs:licenses

      - name: Refuse Rust-section stub
        run: |
          if grep -Fq 'run it locally to view this table' docs/third-party-licenses.md; then
            echo '::error::docs:licenses omitted Rust sidecar tables'
            echo '::error::(cargo/.rsstack missing). Refusing regressing PR.'
            exit 1
          fi

      - name: Detect license doc changes
        id: licenses_diff
        run: |
          if git diff --quiet -- docs/third-party-licenses.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Open a PR instead of pushing to main — the merge-queue ruleset blocks
      # direct pushes, and GitHub Actions cannot be added as a bypass actor
      # on this org (“must be part of the ruleset source or owner organization”).
      # LICENSE_PR_TOKEN (repo-admin PAT on license-automation) opens the PR and
      # admin-merges it so docs-only license updates need no maintainer review.
      # Unique branch per run avoids thrashing one tip under concurrent main pushes.
      - name: Require LICENSE_PR_TOKEN for unattended merge
        if: steps.licenses_diff.outputs.changed == 'true'
        env:
          LICENSE_PR_TOKEN: ${{ secrets.LICENSE_PR_TOKEN }}
        run: |
          if [ -z "${LICENSE_PR_TOKEN}" ]; then
            echo '::error::license-automation secret LICENSE_PR_TOKEN is required.'
            echo '::error::Add a repo-admin fine-grained PAT (Contents + Pull requests: write)'
            echo '::error::as LICENSE_PR_TOKEN on the license-automation environment, then re-run.'
            echo '::error::GITHUB_TOKEN PRs need maintainer approval (merge-queue review +'
            echo '::error::unattributed-change gate) and cannot finish unattended.'
            exit 1
          fi

      - name: Create pull request
        id: cpr
        if: steps.licenses_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.LICENSE_PR_TOKEN }}
          commit-message: 'docs: update third-party licenses'
          title: 'docs: update third-party licenses'
          body: |
            Regenerated `docs/third-party-licenses.md` after dependency changes.

            Opened and admin-merged automatically by `third-party-licenses.yaml`
            via `LICENSE_PR_TOKEN` (direct pushes to `main` are blocked by the
            merge-queue ruleset; this docs-only PR is validated in-job before merge).
          base: main
          branch: chore/third-party-licenses-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            docs/third-party-licenses.md

      # In-job check:licenses + docs:licenses + stub refuse already validated the
      # single-file docs change. Admin merge bypasses required reviews so license
      # maintenance does not wait on a human (see PR #1311).
      - name: Admin-merge license documentation PR
        if: >-
          steps.licenses_diff.outputs.changed == 'true' &&
          steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.LICENSE_PR_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          echo "Merging PR #${PR_NUMBER} (operation=${PR_OPERATION} head=${PR_HEAD_SHA})"
          # Refuse merge if the PR tip moved after create-pull-request stamped the SHA.
          gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash --admin \
            --delete-branch --match-head-commit "${PR_HEAD_SHA}"
