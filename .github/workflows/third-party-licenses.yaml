name: Third-party licenses

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - scripts/generate-third-party-licenses.mjs
      - .github/workflows/third-party-licenses.yaml
  workflow_dispatch:

jobs:
  update:
    name: Update third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Open Source Licenses
        run: pnpm run check:licenses

      - name: Generate third-party licenses
        run: pnpm run docs:licenses

      - name: Commit license report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/third-party-licenses.md
          if git diff --cached --quiet; then
            echo 'No third-party license changes'
            exit 0
          fi
          git commit -m 'docs: update third-party licenses'
          git push
