name: Build/Release Electron App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (all, mac, linux, win, or comma-separated)'
        required: false
        default: all
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-release-compare:
    name: Schema vs last official release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      schema_bumped: ${{ steps.compare.outputs.schema_bumped }}
      curr_schema: ${{ steps.compare.outputs.curr_schema }}
      prev_schema: ${{ steps.compare.outputs.prev_schema }}
      prev_tag: ${{ steps.compare.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compare schema to last published release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: >
          node scripts/ci-schema-release-compare.mjs --release
          --write-readme READ-ME-FIRST-schema.md

      - name: Upload schema compare readme
        uses: actions/upload-artifact@v7
        with:
          name: READ-ME-FIRST-schema-${{ github.sha }}
          path: READ-ME-FIRST-schema.md
          retention-days: 30

  prepare-github-release:
    needs: schema-release-compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure draft GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: node scripts/ci-ensure-github-draft-release.mjs

      # Rebuild schema note from compare-job outputs (not the downloaded artifact) so the
      # patch script never does file→HTTP (CodeQL js/file-access-to-http).
      - name: Patch draft release body with schema note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          MESH_CLIENT_SCHEMA_CURR: ${{ needs.schema-release-compare.outputs.curr_schema }}
          MESH_CLIENT_SCHEMA_PREV: ${{ needs.schema-release-compare.outputs.prev_schema }}
          MESH_CLIENT_SCHEMA_PREV_TAG: ${{ needs.schema-release-compare.outputs.prev_tag }}
        run: node scripts/ci-patch-draft-release-schema-note.mjs

  resolve-release-matrix:
    needs: prepare-github-release
    if: ${{ !cancelled() && needs.prepare-github-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release matrix
        id: matrix
        env:
          RELEASE_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: echo "include=$(node scripts/resolve-release-matrix.mjs)" >> "$GITHUB_OUTPUT"

  release:
    needs: [schema-release-compare, prepare-github-release, resolve-release-matrix]
    if: ${{ !cancelled() && needs.prepare-github-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve-release-matrix.outputs.include) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash scripts/ci-setup-linux-arm64-apt.sh
          sudo apt-get install -y \
            libudev-dev \
            rpm \
            libdbus-1-dev \
            libdbus-1-dev:arm64 \
            pkg-config \
            gcc-aarch64-linux-gnu

      - name: Install Rust toolchain for Reticulum sidecar
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Build Reticulum sidecar for Electron packaging
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/.rsstack
        run: node scripts/build-reticulum-sidecar-release.mjs --platform ${{ matrix.sidecar_platform }}

      - name: Verify staged Reticulum sidecars
        run: node scripts/verify-reticulum-sidecar-staged.mjs --platform ${{ matrix.sidecar_platform }}

      - name: Validate Windows build runner
        if: contains(matrix.build_script, 'dist:win') && matrix.os != 'windows-latest'
        run: |
          echo "Windows build scripts must run on windows-latest."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies
        run: pnpm run rebuild

      - name: Write schema upgrade installer notice
        env:
          MESH_CLIENT_SCHEMA_BUMPED: ${{ needs.schema-release-compare.outputs.schema_bumped }}
          MESH_CLIENT_SCHEMA_CURR: ${{ needs.schema-release-compare.outputs.curr_schema }}
          MESH_CLIENT_SCHEMA_PREV: ${{ needs.schema-release-compare.outputs.prev_schema }}
          MESH_CLIENT_SCHEMA_PREV_TAG: ${{ needs.schema-release-compare.outputs.prev_tag }}
        run: node scripts/write-schema-upgrade-notice.mjs

      - name: Validate macOS signing secrets
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set — skipping notarization secret validation (unsigned/fork build)."
            exit 0
          fi
          missing=""
          [ -z "$CSC_KEY_PASSWORD" ] && missing="$missing CSC_KEY_PASSWORD"
          [ -z "$APPLE_ID" ] && missing="$missing APPLE_ID"
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "CSC_LINK is set but missing required notarization secrets:$missing"
            exit 1
          fi

      # Embeds buildChannel=release + tag + Actions runUrl into the main bundle (support exports / logs).
      - name: Stamp CI build info
        env:
          MESH_CLIENT_BUILD_CHANNEL: release
          MESH_CLIENT_BUILD_WORKFLOW: Build/Release Electron App
        run: node scripts/ci-write-build-info-env.mjs

      - name: Build and Publish
        env:
          # electron-publish reads GH_TOKEN; GITHUB_TOKEN alone is not used for uploads
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing (only effective on macOS runners) ────────────
          # CSC_LINK: base64-encoded .p12 Developer ID Application certificate.
          # CSC_KEY_PASSWORD: password protecting the .p12 file.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          # Disable identity auto-discovery when no cert is available (fork PRs)
          # so electron-builder skips signing gracefully instead of erroring.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK && 'true' || 'false' }}
          # ── macOS notarization ─────────────────────────────────────────────
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        # dist:*:publish scripts run electron-builder with --publish always
        run: ${{ matrix.build_script }}

      # Do not upload raw Mesh-client.app — upload-artifact@v7 dereferences framework
      # symlinks (~3× Electron Framework size). DMG/ZIP preserve correct layout.
      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-client-macos-${{ github.sha }}
          path: |
            release/mac/**/*.dmg
            release/mac/**/*.zip
            release/mac-arm64/**/*.dmg
            release/mac-arm64/**/*.zip
            release/mac-universal/**/*.dmg
            release/mac-universal/**/*.zip
            release/*.dmg
            release/*.zip
          retention-days: 30

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-client-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
            release/linux-unpacked/**/*
            release/linux/**/*.AppImage
            release/linux/**/*.rpm
            release/linux/**/*.deb
          retention-days: 30

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-client-windows-${{ github.sha }}
          path: |
            # Per-arch NSIS installers: Mesh-client Setup {version}.exe + {version}-arm64.exe
            release/*.exe
            release/win-unpacked/**/*
            release/win-arm64-unpacked/**/*
            release/win-x64-unpacked/**/*
          retention-days: 30

  finalize-github-release:
    name: Consolidate draft release assets
    needs: release
    # Require a successful build matrix — skipped/cancelled release must not consolidate.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Consolidate duplicate draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: node scripts/ci-ensure-github-draft-release.mjs

  packaging-smoke:
    name: Smoke test ${{ matrix.label }}
    needs: [release, finalize-github-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            label: macOS packaging
            artifact: mesh-client-macos-${{ github.sha }}
            smoke_run: node scripts/verify-mac-packaging.mjs
          - os: ubuntu-latest
            label: Linux packaging
            artifact: mesh-client-linux-${{ github.sha }}
            smoke_run: node scripts/verify-linux-packaging.mjs && node scripts/test-linux-appimage-reticulum-sidecar.mjs
          - os: windows-latest
            label: x64 NSIS install
            artifact: mesh-client-windows-${{ github.sha }}
            smoke_run: node scripts/test-win-nsis-install.mjs --arch x64
          - os: windows-11-arm
            label: arm64 NSIS install (WoA)
            artifact: mesh-client-windows-${{ github.sha }}
            smoke_run: node scripts/test-win-nsis-install.mjs --arch arm64 --probe-7z
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Pin to workflow SHA — tag ref may move mid-run (e.g. recovery retag) and
          # actions/checkout@v6 fails integrity check against github.sha.
          ref: ${{ github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release

      - name: Install squashfs-tools (cross-arch AppImage extract)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Run packaging smoke test
        run: ${{ matrix.smoke_run }}

      - name: Upload Windows x64 install failure logs
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-client-win-x64-install-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mesh-client-install-x64.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows arm64 install failure logs
        if: failure() && matrix.os == 'windows-11-arm'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-client-win-arm64-install-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mesh-client-install-arm64.log
            ${{ runner.temp }}/mesh-client-7z-probe/**
          if-no-files-found: ignore
          retention-days: 7
