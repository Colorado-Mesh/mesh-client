# One-time migration. This workflow is added by the release-boundary security
# change, runs only from trusted main, removes repository-wide credentials, and
# deletes itself after the migration succeeds.
name: Migrate release secrets into protected environments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-release-secrets.yaml

permissions:
  contents: read

concurrency:
  group: migrate-release-secrets
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and remove repository secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-cut
    steps:
      - name: Checkout trusted main
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.RELEASE_CUT_TOKEN }}
          persist-credentials: false

      - name: Verify external protection boundaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.RELEASE_CUT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::No migration administrator token is available.'
            exit 1
          fi

          require_environment() {
            name="$1"
            policy_name="$2"
            policy_type="$3"
            reviewer_required="$4"
            details="$(gh api "repos/${REPO}/environments/${name}")"
            jq -e '
              .deployment_branch_policy == {
                "protected_branches": false,
                "custom_branch_policies": true
              }
            ' <<<"${details}" >/dev/null
            if [ "${reviewer_required}" = 'true' ]; then
              jq -e '
                any(.protection_rules[];
                  .type == "required_reviewers"
                  and .prevent_self_review == true
                  and any(.reviewers[]; .type == "User" and .reviewer.id == 44416))
              ' <<<"${details}" >/dev/null
            fi
            gh api "repos/${REPO}/environments/${name}/deployment-branch-policies" \
              --jq ".branch_policies[] | select(.name == \"${policy_name}\" and .type == \"${policy_type}\")" \
              | grep -q .
          }

          require_environment release 'v*' tag true
          require_environment release-cut main branch true
          require_environment release-repair main branch true

          ruleset_id="$(gh api "repos/${REPO}/rulesets" \
            --jq '.[] | select(.name == "release tags" and .target == "tag" and .enforcement == "active") | .id')"
          if [ -z "${ruleset_id}" ]; then
            echo '::error::The active release tags ruleset is missing.'
            exit 1
          fi
          ruleset="$(gh api "repos/${REPO}/rulesets/${ruleset_id}")"
          jq -e '
            .conditions.ref_name.include == ["refs/tags/v*"]
            and ([.rules[].type] | sort) == ["creation", "deletion", "update"]
            and any(.bypass_actors[];
              .actor_type == "RepositoryRole"
              and .actor_id == 5
              and .bypass_mode == "always")
          ' <<<"${ruleset}" >/dev/null

          # Committed .github/rulesets/main-merge-queue.json is the source of truth.
          # This only reads the live ruleset; applying it is an owner setting.
          merge_queue_id="$(gh api "repos/${REPO}/rulesets" --jq \
            '.[] | select(.name == "main merge queue" and .target == "branch" and .enforcement == "active") | .id')"
          if [ -z "${merge_queue_id}" ]; then
            echo '::error::The active main merge queue ruleset is missing.'
            exit 1
          fi
          merge_queue="$(gh api "repos/${REPO}/rulesets/${merge_queue_id}")"
          jq -e --slurpfile expected .github/rulesets/main-merge-queue.json '
            .conditions.ref_name.include == $expected[0].conditions.ref_name.include
            and .conditions.ref_name.exclude == $expected[0].conditions.ref_name.exclude
            and .bypass_actors == $expected[0].bypass_actors
            and any(.bypass_actors[];
              .actor_type == "RepositoryRole"
              and .actor_id == 5
              and .bypass_mode == "always")
          ' <<<"${merge_queue}" >/dev/null

      - name: Reconcile protected environment secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.RELEASE_CUT_TOKEN }}
          REPO: ${{ github.repository }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_CUT_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
        run: |
          set -euo pipefail
          secret_exists() {
            environment="$1"
            name="$2"
            gh secret list --env "${environment}" --repo "${REPO}" --json name \
              --jq '.[].name' | grep -Fxq "${name}"
          }
          reconcile_secret() {
            environment="$1"
            destination="$2"
            value="$3"
            if [ -n "${value}" ]; then
              printf '%s' "${value}" \
                | gh secret set "${destination}" --env "${environment}" --repo "${REPO}"
            elif ! secret_exists "${environment}" "${destination}"; then
              echo "::error::Neither source nor ${environment}/${destination} exists."
              exit 1
            fi
          }

          reconcile_secret release APPLE_APP_SPECIFIC_PASSWORD "${APPLE_APP_SPECIFIC_PASSWORD}"
          reconcile_secret release APPLE_ID "${APPLE_ID}"
          reconcile_secret release APPLE_TEAM_ID "${APPLE_TEAM_ID}"
          reconcile_secret release CSC_KEY_PASSWORD "${CSC_KEY_PASSWORD}"
          reconcile_secret release CSC_LINK "${CSC_LINK}"

          reconcile_secret release-cut RELEASE_CUT_TOKEN "${RELEASE_PUSH_TOKEN:-${RELEASE_CUT_TOKEN:-}}"

      - name: Delete repository-wide credentials idempotently
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.RELEASE_CUT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh secret list --repo "${REPO}" --json name --jq '.[].name')"
          for name in \
            APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID \
            CSC_KEY_PASSWORD CSC_LINK RELEASE_PUSH_TOKEN RELEASE_CUT_TOKEN; do
            if grep -Fxq "${name}" <<<"${existing}"; then
              gh secret delete "${name}" --repo "${REPO}"
            fi
          done
          remaining="$(gh secret list --repo "${REPO}" --json name --jq '.[].name')"
          for name in \
            APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID \
            CSC_KEY_PASSWORD CSC_LINK RELEASE_PUSH_TOKEN RELEASE_CUT_TOKEN; do
            if grep -Fxq "${name}" <<<"${remaining}"; then
              echo "::error::Repository secret ${name} still exists."
              exit 1
            fi
          done

      - name: Remove completed migration workflow with race retries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.RELEASE_CUT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path='.github/workflows/migrate-release-secrets.yaml'
          retry_delay_seconds="${MIGRATION_RETRY_DELAY_SECONDS:-3}"
          for attempt in 1 2 3 4 5; do
            if [ "${attempt}" -gt 1 ]; then
              sleep "$((attempt * retry_delay_seconds))"
            fi
            error_log="$(mktemp)"
            if ! metadata="$(gh api "repos/${REPO}/contents/${path}?ref=main" 2>"${error_log}")"; then
              if grep -Eq '^gh: .*\(HTTP 404\)$' "${error_log}"; then
                rm -f "${error_log}"
                echo 'Migration workflow is already absent from main.'
                exit 0
              fi
              cat "${error_log}" >&2
              rm -f "${error_log}"
              echo "Metadata lookup failed (attempt ${attempt}); retrying." >&2
              continue
            fi
            rm -f "${error_log}"
            sha="$(jq -r .sha <<<"${metadata}")"
            if gh api --method DELETE "repos/${REPO}/contents/${path}" \
              -f message='chore: remove completed release secret migration' \
              -f sha="${sha}" -f branch=main >/dev/null; then
              exit 0
            fi
            echo "Self-removal raced with main (attempt ${attempt}); retrying."
          done
          echo '::error::Could not remove migration workflow after five fresh-SHA attempts.'
          exit 1
