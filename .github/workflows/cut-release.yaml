# Release on merge: when a release pull request (`pnpm run release:open`) lands on main with a new
# package version, tag that commit vX.Y.Z. The tag push starts release.yaml and flatpak.yaml,
# which build the draft release; a maintainer reviews the artifacts and clicks Publish.
#
# The version bump was made by the release pull request and checked before merge by the release
# gates in e2e.yaml (Electron E2E on three operating systems and the release preflight), so this
# workflow only decides and tags. The plan tags only a tree those gates passed: when something
# else reached main between the release pull request's checks and its merge, it fails and says
# to run E2E on main, then Cut release on main. Ordinary pushes to main end at the plan job with
# no approval prompt.
#
# The tag job runs in the protected `release-cut` environment (maintainer approval) and pushes
# with RELEASE_CUT_TOKEN, a PAT (or GitHub App token) owned by a repo **admin** with
# contents:write + workflows:write: only admins may create v* tags (release tags ruleset), and a
# tag pushed with the default GITHUB_TOKEN would not start release.yaml / flatpak.yaml (GitHub
# recursion guard). That job runs no Node and installs nothing.
#
# Manual dispatch on main re-checks the current main commit, for example after a declined
# approval or once E2E has passed on main.

name: Cut release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, in order. A run that waits for the release-cut approval holds the group, and
# queue: max keeps every run behind it; the default keeps only the newest waiting run, so a
# releasing merge could be dropped and its version tagged on a later commit. A later run whose
# version is already tagged ends at the plan job.
concurrency:
  group: cut-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Plan release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # The release gates' check runs on the commit and on the release pull request's head, and
      # the workflow behind each one (only e2e.yaml's runs count).
      checks: read
      actions: read
    outputs:
      should_tag: ${{ steps.plan.outputs.should_tag }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout main
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          # Release tags are needed to find the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Decide whether this commit releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-plan.mjs --sha "$GITHUB_SHA"

  tag:
    name: Tag release
    needs: plan
    if: needs.plan.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    environment: release-cut
    permissions:
      contents: read
    steps:
      - name: Checkout main
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # --cleanup=verbatim keeps the notes' markdown headings, which git's default cleanup
      # strips as comments. release.yaml copies this message into the draft release body.
      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' "${RELEASE_NOTES}" > "${notes_file}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" --cleanup=verbatim -F "${notes_file}" "${GITHUB_SHA}"

      - name: Push release tag
        env:
          RELEASE_CUT_TOKEN: ${{ secrets.RELEASE_CUT_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_CUT_TOKEN}" ]; then
            echo '::error::Set release-cut environment secret RELEASE_CUT_TOKEN.'
            exit 1
          fi

          ASKPASS="${RUNNER_TEMP}/mesh-release-askpass.sh"
          cleanup() {
            rm -f "${ASKPASS}"
            unset GIT_ASKPASS GIT_TERMINAL_PROMPT RELEASE_CUT_TOKEN
          }
          trap cleanup EXIT
          umask 077
          # Keep variable expansion inside the askpass process, not while creating it.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *) printf "%s\n" "$RELEASE_CUT_TOKEN" ;;' \
            'esac' > "${ASKPASS}"
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}"
          export GIT_TERMINAL_PROMPT=0

          git push origin "refs/tags/${RELEASE_TAG}"

          {
            echo "## Next steps"
            echo ""
            echo "1. Wait for **Build/Release Electron App** (\`release.yaml\`) and **Build Flatpak**"
            echo "   to finish, including **Verify draft release tag_name**."
            echo "2. Open the draft on GitHub Releases and confirm the tag is"
            echo "   \`${RELEASE_TAG}\`, **not** \`untagged-*\`, and that the notes came through."
            echo "3. Only then click **Publish release**."
          } >> "$GITHUB_STEP_SUMMARY"
