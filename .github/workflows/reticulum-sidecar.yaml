name: Reticulum sidecar

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'reticulum-sidecar/**'
      - '.github/workflows/reticulum-sidecar.yaml'
      - 'scripts/build-reticulum-sidecar-release.mjs'
      - 'scripts/clone-ratspeak-stack.sh'
      - 'scripts/ensure-rsReticulum-patches.sh'
      - 'scripts/apply-rsLXMF-*.sh'
  pull_request:
    paths:
      - 'reticulum-sidecar/**'
      - '.github/workflows/reticulum-sidecar.yaml'
      - 'scripts/build-reticulum-sidecar-release.mjs'
      - 'scripts/clone-ratspeak-stack.sh'
      - 'scripts/ensure-rsReticulum-patches.sh'
      - 'scripts/apply-rsLXMF-*.sh'

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/..
        run: bash scripts/clone-ratspeak-stack.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - name: Install Linux BLE build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo fmt --check (rsNomad)
        working-directory: ${{ github.workspace }}/../rsNomad
        # Format only workspace members — `--all` also walks path deps into rsReticulum.
        run: cargo fmt -p nomad-core -- --check
      - name: cargo clippy (rsNomad)
        working-directory: ${{ github.workspace }}/../rsNomad
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt --check
        working-directory: reticulum-sidecar
        run: cargo fmt --check
      - name: cargo clippy (rns-stack)
        working-directory: reticulum-sidecar
        run: >-
          cargo clippy --all-targets
          --features rns-stack,rns-ble,rns-rnode-tcp
          -- -D warnings

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mesh-client-reticulum-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mesh-client-reticulum-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mesh-client-reticulum-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Optional rns-stack path deps must exist on disk even for the default stub build.
      # checkout@v6 only allows paths under GITHUB_WORKSPACE; Cargo expects Ratspeak siblings.
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/..
        run: bash scripts/clone-ratspeak-stack.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Build sidecar (stub)
        working-directory: reticulum-sidecar
        run: |
          cargo test
          cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            reticulum-sidecar/target/${{ matrix.target }}/release/mesh-client-reticulum*
          retention-days: 14

  build-rns-stack:
    env:
      RS_RETICULUM_REF: 9928abed269a83ec5a7ef165ff1142d938cad706
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mesh-client-reticulum-rns-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mesh-client-reticulum-rns-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mesh-client-reticulum-rns-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/..
        run: bash scripts/clone-ratspeak-stack.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux BLE build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build sidecar (rns-stack)
        working-directory: reticulum-sidecar
        run: |
          cargo test --features rns-stack,rns-ble,rns-rnode-tcp
          cargo build --release --target ${{ matrix.target }} --features rns-stack,rns-ble,rns-rnode-tcp
      - name: Upload rns-stack artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            reticulum-sidecar/target/${{ matrix.target }}/release/mesh-client-reticulum*
          retention-days: 14

  build-windows-arm64:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # Optional rns-stack path deps must exist on disk even for the default stub build.
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/..
        run: bash scripts/clone-ratspeak-stack.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build WoA sidecar (stub)
        working-directory: reticulum-sidecar
        run: |
          cargo test
          cargo build --release --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-client-reticulum-win-arm64
          path: reticulum-sidecar/target/aarch64-pc-windows-msvc/release/mesh-client-reticulum.exe
          retention-days: 14

  build-windows-arm64-rns-stack:
    env:
      RS_RETICULUM_REF: 9928abed269a83ec5a7ef165ff1142d938cad706
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone Ratspeak stack (rsReticulum, rsLXMF, rsNomad)
        shell: bash
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/..
        run: bash scripts/clone-ratspeak-stack.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build WoA sidecar (rns-stack)
        working-directory: reticulum-sidecar
        run: |
          cargo test --features rns-stack,rns-ble,rns-rnode-tcp
          cargo build --release --target aarch64-pc-windows-msvc --features rns-stack,rns-ble,rns-rnode-tcp
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-client-reticulum-rns-win-arm64
          path: reticulum-sidecar/target/aarch64-pc-windows-msvc/release/mesh-client-reticulum.exe
          retention-days: 14
