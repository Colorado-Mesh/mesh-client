name: PR labeler

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# pull_request (not pull_request_target): labeling only needs GITHUB_TOKEN write on
# same-repo PRs, and GitHub's default public-repo policy browns out / will block
# pull_request_target. Fork PRs are skipped — their tokens are read-only for labels.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Run the base-ref labeler script only; PR head code is never executed.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Apply type / protocol / platform labels
        run: node scripts/label-pr.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
