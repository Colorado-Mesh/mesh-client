name: CodeQL (advanced)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect CodeQL changes
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      vars.CODEQL_ADVANCED_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      # Only a successful, explicit false may skip Swift. API/detector errors scan it.
      swift: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' ||
        steps.filter.outputs.all_count == '' || steps.filter.outputs.all_count >= 3000 ||
        steps.filter.outputs.swift != 'false' }}
      # Swift is omitted here, not in the analyze job if: that if cannot read matrix.
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # The PR files API handles additions, deletions and renames without checkout.
      # dorny/paths-filter v4.0.0
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          filters: |
            # The PR files API caps its response at 3,000 files; never trust a truncated list.
            all:
              - '**'
            swift:
              - '**/*.swift'
              - '**/Package.resolved'
              - 'native/ai/**'
              - 'scripts/build-ai-helper*'
              - 'scripts/*codeql*'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      # matrix is not a job-level context, so drop the Swift cell before the
      # runner is chosen. A false SWIFT value means the paths filter succeeded
      # and Swift inputs did not change.
      - id: matrix
        env:
          SWIFT: >-
            ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' ||
            steps.filter.outputs.all_count == '' || steps.filter.outputs.all_count >= 3000 ||
            steps.filter.outputs.swift != 'false' }}
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const rows = [
            { language: 'actions', os: 'ubuntu-latest', 'build-mode': 'none' },
            { language: 'csharp', os: 'ubuntu-latest', 'build-mode': 'none' },
            { language: 'javascript-typescript', os: 'ubuntu-latest', 'build-mode': 'none' },
            { language: 'python', os: 'ubuntu-latest', 'build-mode': 'none' },
            { language: 'rust', os: 'ubuntu-latest', 'build-mode': 'none' },
          ];
          if (process.env.SWIFT === 'true') {
            rows.push({ language: 'swift', os: 'macos-latest', 'build-mode': 'autobuild' });
          }
          process.stdout.write(`matrix=${JSON.stringify(rows)}\n`);
          EOF

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    # PRs validate the replacement without uploading while default setup is active.
    # Enable uploads only after disabling default setup; see .github/codeql/README.md.
    # The matrix from scope omits Swift when it is out of scope, so a macOS runner
    # is not allocated. Other languages keep the default CodeQL setup behavior.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      vars.CODEQL_ADVANCED_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.scope.outputs.matrix) }}
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.language != 'swift' || needs.scope.outputs.swift == 'true'
        with:
          persist-credentials: false

      # github/codeql-action v4.39.1
      - name: Initialize CodeQL
        if: matrix.language != 'swift' || needs.scope.outputs.swift == 'true'
        uses: github/codeql-action/init@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          dependency-caching: true
          # Deliberately do not load the legacy config that excludes a query.
          config: |
            threat-models: [remote]

      - name: Build Swift helper
        if: matrix.language == 'swift' && needs.scope.outputs.swift == 'true'
        uses: github/codeql-action/autobuild@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d

      - name: Perform CodeQL Analysis
        if: matrix.language != 'swift' || needs.scope.outputs.swift == 'true'
        uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ vars.CODEQL_ADVANCED_ENABLED == 'true' && 'always' || 'never' }}

      - name: Upload analysis results
        if: always() && (matrix.language != 'swift' || needs.scope.outputs.swift == 'true')
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          retention-days: 7
          if-no-files-found: warn

      - name: Record unchanged Swift inputs
        if: matrix.language == 'swift' && needs.scope.outputs.swift != 'true'
        run: echo 'Swift inputs unchanged; full Swift scans still run on protected events.' >> "$GITHUB_STEP_SUMMARY"
