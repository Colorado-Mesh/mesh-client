# Auto-repair when Publish rebinds tag_name to `untagged-*`, plus maintainer
# workflow_dispatch recovery. Complements finalize verify in release.yaml —
# publish is manual and outside that gate; GitHub can detach on Publish even
# after a green draft verify.
#
# Auto path (release published): no environment approval — GITHUB_TOKEN only.
# Manual path (workflow_dispatch on main): release-repair environment.

name: Repair published release tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag_name (vX.Y.Z or untagged-*)'
        required: true
        type: string
      release_name:
        description: 'Published release name (required for untagged-* repair)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  repair-on-publish:
    name: Auto-repair after publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Resolve vX.Y.Z tag and repair if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event.release.name }}
        run: node scripts/repair-published-release-tag.mjs --from-event

  repair:
    name: Repair published release tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-repair
    steps:
      - name: Checkout code
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Resolve vX.Y.Z tag and repair if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ inputs.release_name }}
        run: node scripts/repair-published-release-tag.mjs --from-event
