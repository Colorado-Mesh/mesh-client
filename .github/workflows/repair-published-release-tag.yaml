# Maintainer-invoked recovery for a release published with tag_name `untagged-*`
# (or rebound after verify): reattach it to vX.Y.Z and delete the orphan ref.
#
# Complements finalize verify in release.yaml — publish is manual and outside that gate.

name: Repair published release tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag_name (vX.Y.Z or untagged-*)'
        required: true
        type: string
      release_name:
        description: 'Published release name (required for untagged-* repair)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  repair:
    name: Repair published release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-repair
    steps:
      - name: Checkout code
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Resolve vX.Y.Z tag and repair if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG}"
          if [[ "${TAG}" == untagged-* ]]; then
            NAME="${EVENT_NAME}"
            if [[ "${NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG="v${NAME}"
              echo "Published release is on ${EVENT_TAG}; repairing to ${TAG}"
            else
              echo "::error::Published release has untagged tag_name and non-semver name=${NAME}"
              exit 1
            fi
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-semver release tag ${TAG}"
            exit 0
          fi
          export RELEASE_TAG="${TAG}"
          node scripts/repair-published-release-tag.mjs
