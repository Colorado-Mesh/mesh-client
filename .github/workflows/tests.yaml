name: Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Coverage (${{ matrix.project }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [renderer-ui, renderer-logic, main]
    env:
      VITEST_COVERAGE_SHARD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage (${{ matrix.project }})
        run: >-
          pnpm exec vitest run --coverage
          --project ${{ matrix.project }}
          --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.project }}.json
          --coverage.clean=false

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.project }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  merge-reports:
    name: Merge coverage
    needs: tests
    if: always() && !cancelled() && needs.tests.result != 'cancelled'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          path: .vitest-reports
          pattern: vitest-blob-*
          merge-multiple: true

      - name: Merge coverage reports
        run: pnpm run test:coverage:merge

      # Skip actions/upload-code-coverage: GitHub Code Quality (Team/Enterprise)
      # is not available on the free org plan — uploads return HTTP 403.

      - name: Upload test results
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
