# Run scripts/release.sh pre-flight on a fresh runner, in the same toolchain as
# Cut release (shared setup-node-pnpm + setup-release-toolchain composites), and
# stop before any version bump, tag, or push (`--preflight-only`).
#
# Catches release-only failures that a maintainer's warm checkout hides (e.g. a
# check that needs .rsstack/, a tool missing from the Cut release runner) before
# anyone clicks Cut release. Runs on PRs that touch release plumbing, nightly on
# main, and on demand.

name: Release preflight

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - 'scripts/release.sh'
      - 'scripts/clone-ratspeak-stack.sh'
      - 'scripts/check-rust-licenses.mjs'
      - 'scripts/check-environment.mjs'
      - '.github/workflows/cut-release.yaml'
      - '.github/workflows/release-preflight.yaml'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/actions/setup-release-toolchain/**'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Tags are required for LAST_TAG / bump detection.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node, pnpm, and dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup release toolchain
        uses: ./.github/actions/setup-release-toolchain

      - name: Run release pre-flight (--preflight-only)
        env:
          MESH_CLIENT_RELEASE_YES: '1'
          MESH_CLIENT_RELEASE_PARSE_ONLY: ''
        run: pnpm run release -- --preflight-only
