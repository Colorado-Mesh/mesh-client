sonar.organization=colorado-mesh
sonar.projectKey=Colorado-Mesh_mesh-client
# Project lives on SonarQube Cloud (sonarcloud.io), not the US regional host.
sonar.host.url=https://sonarcloud.io

# First-party product sources only (Electron app + Reticulum sidecar).
# Do not analyze build tooling, CI, packaging, patches, or generated locales.
sonar.sources=src,reticulum-sidecar/src

# Noise / generated / third-party / non-product trees
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-electron/**,**/coverage/**,**/target/**,**/.vitest-reports/**,**/release/**,src/renderer/locales/**,**/*.d.ts,scripts/**,flatpak/**,.github/**,patches/**,reticulum-sidecar/patches/**,resources/**

# Tests (Vitest) — first-party only
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs

# Coverage from Vitest merge job + optional Rust sidecar LCOV (when artifact present)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.rust.lcov.reportPaths=reticulum-sidecar/lcov.info

# TypeScript accuracy
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json

# Large Electron codebase — avoid OOM/timeouts
sonar.javascript.node.maxspace=8192

# Analysis is via SonarCloud dashboard Autoscan (not GitHub Actions).
# Free-plan Sonar Way includes cognitive complexity we cannot customize in CI.
# Autoscan does not apply multicriteria from this file — set Ignore Issues on
# Multiple Criteria in the SonarCloud project Analysis Scope UI to match below.

# ---------------------------------------------------------------------------
# Issue suppressions (Sonar Way profile is read-only on Free; suppress noise
# here). Keep BUG rules and real security findings visible; suppress style and
# accepted platform/dev-tooling risk.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=void_ts,void_js,ternary_ts,ternary_js,complexity_ts,complexity_js,complexity_rust,props_readonly,node_protocol_ts,node_protocol_js,number_static,assertion_specific,nested_fn,aria_role,replace_all,shell_double_bracket,ctor_readonly,modern_js_style,typeerror_style,array_from_ts,array_from_js,path_scripts_js,path_scripts_ts,path_main_index,path_sidecar_path,csp_html,tmpdir_vitest,tmpdir_dev_stub,mqtt_demo_password,firmware_eval,firmware_llm,firmware_tmpdir,char_code,react_index_keys,nested_templates,param_tests,too_many_params,regex_backtrack_ts,regex_backtrack_js,promise_resolve,object_assign_style,optional_undefined,unused_type_alias,prefer_at,multi_push,redundant_act,use_state_pair,typeof_undefined,union_alias,unused_prop,string_raw,includes_some,cond_default,object_has_own,prefer_set,hardcoded_ip,bool_param,regex_complexity,concise_class,catch_name,outer_fn,error_msg,object_default_param,indexof_findindex,prefer_some,blob_text,default_param,math_min_max,math_hypot,string_ctor,neg_index,group_length,ambiguous_jsx,presence_query,codeql_newline_alt

# Intentional void promise() for floating promises in React runtimes
sonar.issue.ignore.multicriteria.void_ts.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.void_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.void_js.ruleKey=javascript:S3735
sonar.issue.ignore.multicriteria.void_js.resourceKey=**/*

# Nested ternaries — JSX-heavy UI; Prettier already formats these
sonar.issue.ignore.multicriteria.ternary_ts.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.ternary_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.ternary_js.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.ternary_js.resourceKey=**/*

# Cognitive complexity — TS/JS runtimes and Rust sidecar exceed threshold 15 by design
sonar.issue.ignore.multicriteria.complexity_ts.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.complexity_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.complexity_js.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.complexity_js.resourceKey=**/*
sonar.issue.ignore.multicriteria.complexity_rust.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.complexity_rust.resourceKey=**/*

# React props readonly — false positives with Omit/Pick utility types
sonar.issue.ignore.multicriteria.props_readonly.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.props_readonly.resourceKey=**/*

# node: import prefix preference — not a correctness issue
sonar.issue.ignore.multicriteria.node_protocol_ts.ruleKey=typescript:S7772
sonar.issue.ignore.multicriteria.node_protocol_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.node_protocol_js.ruleKey=javascript:S7772
sonar.issue.ignore.multicriteria.node_protocol_js.resourceKey=**/*

# Number.parseInt vs parseInt style
sonar.issue.ignore.multicriteria.number_static.ruleKey=typescript:S7773
sonar.issue.ignore.multicriteria.number_static.resourceKey=**/*

# Vitest assertion specificity preference
sonar.issue.ignore.multicriteria.assertion_specific.ruleKey=typescript:S5906
sonar.issue.ignore.multicriteria.assertion_specific.resourceKey=**/*

# Nested function depth in IPC handlers and event callbacks
sonar.issue.ignore.multicriteria.nested_fn.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.nested_fn.resourceKey=**/*

# Prefer native tag over ARIA role — conflicts with intentional a11y patterns
sonar.issue.ignore.multicriteria.aria_role.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.aria_role.resourceKey=**/*

# Minor style (e.g. replaceAll preference)
sonar.issue.ignore.multicriteria.replace_all.ruleKey=typescript:S7781
sonar.issue.ignore.multicriteria.replace_all.resourceKey=**/*

# Bash [[ vs [ in scripts
sonar.issue.ignore.multicriteria.shell_double_bracket.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.shell_double_bracket.resourceKey=**/*

# Constructor-only fields should be readonly — style
sonar.issue.ignore.multicriteria.ctor_readonly.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.ctor_readonly.resourceKey=**/*

# Minor modern-JS style preferences
sonar.issue.ignore.multicriteria.modern_js_style.ruleKey=typescript:S7763
sonar.issue.ignore.multicriteria.modern_js_style.resourceKey=**/*

# Minor style (TypeError vs Error)
sonar.issue.ignore.multicriteria.typeerror_style.ruleKey=typescript:S7786
sonar.issue.ignore.multicriteria.typeerror_style.resourceKey=**/*

# Unnecessary Array.from before for…of — style/noise
sonar.issue.ignore.multicriteria.array_from_ts.ruleKey=typescript:S7747
sonar.issue.ignore.multicriteria.array_from_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.array_from_js.ruleKey=javascript:S7747
sonar.issue.ignore.multicriteria.array_from_js.resourceKey=**/*

# Build/dev scripts intentionally inherit or prepend PATH for cargo/bash tooling.
# Prefer absolute executable paths in new code; keep these for legacy spawn sites.
sonar.issue.ignore.multicriteria.path_scripts_js.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path_scripts_js.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.path_scripts_ts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path_scripts_ts.resourceKey=scripts/**/*

# Sidecar subprocess PATH wiring (documented in code)
sonar.issue.ignore.multicriteria.path_main_index.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path_main_index.resourceKey=src/main/index.ts
sonar.issue.ignore.multicriteria.path_sidecar_path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path_sidecar_path.resourceKey=src/main/reticulum-sidecar-path.ts

# Electron + Vite require style-src 'unsafe-inline' and broad connect-src
sonar.issue.ignore.multicriteria.csp_html.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.csp_html.resourceKey=src/renderer/index.html

# Test/dev stubs using tmp paths
sonar.issue.ignore.multicriteria.tmpdir_vitest.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.tmpdir_vitest.resourceKey=**/vitest.electronApiMock.ts
sonar.issue.ignore.multicriteria.tmpdir_dev_stub.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.tmpdir_dev_stub.resourceKey=**/devElectronApiStub.ts

# Public Meshtastic demo broker password (meshdev / large4cats), not a secret
sonar.issue.ignore.multicriteria.mqtt_demo_password.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.mqtt_demo_password.resourceKey=src/renderer/lib/meshtasticMqttTlsMigration.ts

# Dev-only firmware config generator — accepted risk
sonar.issue.ignore.multicriteria.firmware_eval.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.firmware_eval.resourceKey=scripts/gen-firmware-configs.mjs
sonar.issue.ignore.multicriteria.firmware_llm.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.firmware_llm.resourceKey=scripts/gen-firmware-configs.mjs
sonar.issue.ignore.multicriteria.firmware_tmpdir.ruleKey=javascript:S5443
sonar.issue.ignore.multicriteria.firmware_tmpdir.resourceKey=scripts/gen-firmware-configs.mjs

# Byte-oriented charCodeAt/fromCharCode (keys, hashes, binary) — codePointAt is wrong here
sonar.issue.ignore.multicriteria.char_code.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.char_code.resourceKey=**/*

# Stable React keys for chat/segment lists often need array index when no stable id exists
sonar.issue.ignore.multicriteria.react_index_keys.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.react_index_keys.resourceKey=**/*

# Nested template literals — readability preference, not correctness
sonar.issue.ignore.multicriteria.nested_templates.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.nested_templates.resourceKey=**/*

# Prefer parameterized Vitest — style; explicit cases are clearer for protocol fixtures
sonar.issue.ignore.multicriteria.param_tests.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.param_tests.resourceKey=**/*

# Too many parameters — panel/admin action helpers are intentionally flat
sonar.issue.ignore.multicriteria.too_many_params.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.too_many_params.resourceKey=**/*

# Regex ReDoS on trusted protocol/sidecar log lines — bounded inputs; not user-controlled
sonar.issue.ignore.multicriteria.regex_backtrack_ts.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.regex_backtrack_ts.resourceKey=**/*
sonar.issue.ignore.multicriteria.regex_backtrack_js.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.regex_backtrack_js.resourceKey=**/*

# return Promise.resolve(value) vs return value in async Protocol stubs
sonar.issue.ignore.multicriteria.promise_resolve.ruleKey=typescript:S7746
sonar.issue.ignore.multicriteria.promise_resolve.resourceKey=**/*

# Object.assign vs spread — style
sonar.issue.ignore.multicriteria.object_assign_style.ruleKey=typescript:S6661
sonar.issue.ignore.multicriteria.object_assign_style.resourceKey=**/*

# Redundant optional + undefined union — style noise on IPC/option types
sonar.issue.ignore.multicriteria.optional_undefined.ruleKey=typescript:S4782
sonar.issue.ignore.multicriteria.optional_undefined.resourceKey=**/*

# Type alias of primitive — domain aliases (e.g. NodeNum) are intentional
sonar.issue.ignore.multicriteria.unused_type_alias.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.unused_type_alias.resourceKey=**/*

# Prefer .at() over [length - n] — style noise across binary/protocol code
sonar.issue.ignore.multicriteria.prefer_at.ruleKey=typescript:S7755
sonar.issue.ignore.multicriteria.prefer_at.resourceKey=**/*

# Multiple Array#push — hot-path byte builders prefer explicit pushes
sonar.issue.ignore.multicriteria.multi_push.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.multi_push.resourceKey=**/*

# Redundant act() in tests — Testing Library helpers vary by call site
sonar.issue.ignore.multicriteria.redundant_act.ruleKey=typescript:S8980
sonar.issue.ignore.multicriteria.redundant_act.resourceKey=**/*

# useState not destructured as [v, setV] — tuple rename / single-element patterns
sonar.issue.ignore.multicriteria.use_state_pair.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.use_state_pair.resourceKey=**/*

# typeof x === 'undefined' — guards for optional globals / SSR-safe checks
sonar.issue.ignore.multicriteria.typeof_undefined.ruleKey=typescript:S7741
sonar.issue.ignore.multicriteria.typeof_undefined.resourceKey=**/*

# Inline union vs type alias — style
sonar.issue.ignore.multicriteria.union_alias.ruleKey=typescript:S4323
sonar.issue.ignore.multicriteria.union_alias.resourceKey=**/*

# Unused props — intentional memo comparator keys / API-stable optional callbacks
sonar.issue.ignore.multicriteria.unused_prop.ruleKey=typescript:S6767
sonar.issue.ignore.multicriteria.unused_prop.resourceKey=**/*

# String.raw preference — style
sonar.issue.ignore.multicriteria.string_raw.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.string_raw.resourceKey=**/*

# .includes vs .some — style
sonar.issue.ignore.multicriteria.includes_some.ruleKey=typescript:S7765
sonar.issue.ignore.multicriteria.includes_some.resourceKey=**/*

# Unnecessary conditional for default — style
sonar.issue.ignore.multicriteria.cond_default.ruleKey=typescript:S6644
sonar.issue.ignore.multicriteria.cond_default.resourceKey=**/*

# Object.hasOwn vs hasOwnProperty.call — keep call for older Electron targets
sonar.issue.ignore.multicriteria.object_has_own.ruleKey=typescript:S6653
sonar.issue.ignore.multicriteria.object_has_own.resourceKey=**/*

# Prefer Set for membership — arrays kept for small fixed lists / iteration order
sonar.issue.ignore.multicriteria.prefer_set.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.prefer_set.resourceKey=**/*

# Hardcoded hub / transport IPs — Reticulum presets and RNode defaults
