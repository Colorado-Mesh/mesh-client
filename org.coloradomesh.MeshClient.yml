app-id: org.coloradomesh.MeshClient
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: mesh-client
separate-locales: false

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

build-options:
  append-path: /usr/lib/sdk/node22/bin

finish-args:
  - --device=all
  - --allow=bluetooth
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=home
  - --system-talk-name=org.bluez
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=NODE_ENV=production
  - --env=ELECTRON_IS_DEV=0
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: mesh-client
    buildsystem: simple
    build-options:
      prepend-path: /run/build/mesh-client/.pnpm-bin
      env:
        PNPM_HOME: /run/build/mesh-client/.pnpm
        pnpm_config_cache: /run/build/mesh-client/.npm
        # Values must be YAML strings (quoted). Unquoted true/false become JSON
        # booleans and flatpak-builder drops the entire env map (GStrv warning).
        # pnpm 11 supply-chain / verifyDepsBeforeRun must not hit the registry offline.
        PNPM_CONFIG_TRUST_LOCKFILE: 'true'
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    build-commands:
      # Install pnpm standalone from archived release (no network needed).
      # Archive extracts to pnpm-vendor/ (strip-components: 0) so the root `pnpm` binary is
      # kept and the bundled dist/ does not collide with app dist/. pnpm 11+ requires
      # dist/pnpm.mjs next to the wrapper binary (install alone is not enough).
      - install -Dm755 pnpm-vendor/pnpm /run/build/mesh-client/.pnpm-bin/pnpm
      - cp -a pnpm-vendor/dist /run/build/mesh-client/.pnpm-bin/dist
      # Offline install using generated-sources.json (retries @jsr temp-dir races).
      # --store-dir must use the sandbox-absolute path because the type:shell
      # source that writes storeDir into pnpm-workspace.yaml (pnpm store v11) or
      # .npmrc (older) runs outside the sandbox, so $PWD there is the host cache
      # path, not the in-sandbox /run/build/mesh-client path.
      - node scripts/flatpak-pnpm-install.mjs
      # Build renderer, main, and preload (optional CI stamp from flatpak/ci-build-info.json)
      - |
        if [ -f flatpak/ci-build-info.json ]; then
          export MESH_CLIENT_BUILD_INFO="$(cat flatpak/ci-build-info.json)"
        fi
        pnpm run build
      # Rebuild native addons (noble BLE, sqlite) against the bundled Electron ABI
      - pnpm run rebuild
      # Install app payload (Electron binary + app roots; zypak needs a real Chromium binary)
      - install -dm755 /app/lib/mesh-client
      - install -Dm644 package.json /app/lib/mesh-client/package.json
      # pnpm --ignore-scripts skips electron's postinstall; unpack vendored release zips instead
      - cp -a electron-prebuilt /app/lib/mesh-client/electron
      - cp -a dist dist-electron node_modules resources /app/lib/mesh-client/
      # Wrapper script
      - install -Dm755 flatpak/mesh-client-wrapper.sh /app/bin/mesh-client
      # Icons
      - |
        install -Dm644 resources/icons/linux/256x256.png \
          /app/share/icons/hicolor/256x256/apps/org.coloradomesh.MeshClient.png
        install -Dm644 resources/icons/linux/128x128.png \
          /app/share/icons/hicolor/128x128/apps/org.coloradomesh.MeshClient.png
        install -Dm644 resources/icons/linux/64x64.png \
          /app/share/icons/hicolor/64x64/apps/org.coloradomesh.MeshClient.png
      # Desktop entry and MetaInfo
      - |
        install -Dm644 flatpak/org.coloradomesh.MeshClient.desktop \
          /app/share/applications/org.coloradomesh.MeshClient.desktop
        install -Dm644 flatpak/org.coloradomesh.MeshClient.metainfo.xml \
          /app/share/metainfo/org.coloradomesh.MeshClient.metainfo.xml
    sources:
      - type: dir
        path: .
      - flatpak/generated-sources.json
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v11.21.0/pnpm-linux-x64.tar.gz
        sha256: aadc489ce4473c2af0fec06a5c19e113b5793d404eac49853c8153bf4b0d8263
        dest: pnpm-vendor
        # pnpm tarball has root-level `pnpm` + `dist/`; default strip-components:1 drops the binary.
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v11.21.0/pnpm-linux-arm64.tar.gz
        sha256: 64eb219b008f7a4c176d81fbce919c20b0b7e093e815cbb669d46e681451f43b
        dest: pnpm-vendor
        strip-components: 0
        only-arches: [aarch64]
      - type: archive
        url: https://github.com/electron/electron/releases/download/v41.10.5/electron-v41.10.5-linux-x64.zip
        sha256: 87834dc7d02557c325d190743b158fa93ed76abb4f61ddb3c041db21875f1bbc
        dest: electron-prebuilt
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/electron/electron/releases/download/v41.10.5/electron-v41.10.5-linux-arm64.zip
        sha256: 427886215b33aebde0416da85b0b3397f6d1bd6fde72b8d1b69444f686133f0f
        dest: electron-prebuilt
        only-arches: [aarch64]
